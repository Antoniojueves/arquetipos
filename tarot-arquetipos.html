<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Los 22 Arcanos Mayores del Tarot Rider-Waite como mapa del proceso de individuación jungiano">
<title>Tarot & Arquetipos Jungianos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a;
    --bg2: #131110;
    --bg3: #1a1714;
    --bg4: #211e1a;
    --gold: #c9a84c;
    --gold2: #e8cb7a;
    --gold3: rgba(201,168,76,0.15);
    --gold4: rgba(201,168,76,0.08);
    --text1: #ede5d4;
    --text2: #a09080;
    --text3: #6a5f52;
    --border: rgba(201,168,76,0.14);
    --border2: rgba(201,168,76,0.28);
    --c-inner: #9b8ee0;
    --c-outer: #5aab87;
    --c-shadow: #c47250;
    --radius: 10px;
    --radius-sm: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text1);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px 60px;
    position: relative;
    z-index: 1;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    padding: 48px 0 36px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    position: relative;
  }

  .site-header::after {
    content: '✦';
    display: block;
    color: var(--gold);
    font-size: 12px;
    margin-top: 16px;
    opacity: 0.6;
  }

  .site-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--gold2);
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .site-subtitle {
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── Package navigation ── */
  .pkg-nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .pkg-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.06em;
    padding: 8px 16px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .pkg-btn:hover {
    border-color: var(--gold);
    color: var(--gold2);
  }

  .pkg-btn.active {
    background: var(--gold3);
    border-color: var(--gold);
    color: var(--gold2);
  }

  /* ── Card navigation ── */
  .card-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 16px 0 0;
    margin-bottom: 28px;
    border-top: 1px solid var(--border);
  }

  .card-nav.hidden { display: none; }

  .card-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    font-weight: 400;
    padding: 5px 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent;
    color: var(--text3);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .card-btn:hover {
    border-color: var(--border2);
    color: var(--text2);
  }

  .card-btn.active {
    background: var(--gold4);
    border-color: var(--gold);
    color: var(--gold2);
  }

  /* ── Card panel ── */
  .card-panel {
    display: none;
    animation: fadeUp 0.25s ease;
  }

  .card-panel.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Card header ── */
  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .card-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 400;
    color: var(--gold);
    line-height: 1;
    min-width: 52px;
    padding-top: 2px;
    opacity: 0.8;
  }

  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 500;
    color: var(--text1);
    margin-bottom: 3px;
    line-height: 1.2;
  }

  .card-sub {
    font-size: 14px;
    font-weight: 300;
    color: var(--text3);
    font-style: italic;
  }

  /* ── Description ── */
  .card-desc {
    font-size: 16px;
    font-weight: 300;
    line-height: 1.75;
    color: var(--text2);
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Etapa tag ── */
  .etapa-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 28px;
    background: var(--gold4);
  }

  /* ── Section ── */
  .section { margin-bottom: 28px; }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
  }

  /* ── Conflicts grid ── */
  .conflicts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 480px) {
    .conflicts-grid { grid-template-columns: 1fr; }
  }

  .conflict-card {
    background: var(--bg2);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius);
    padding: 14px 15px;
    transition: border-color 0.2s;
  }

  .conflict-card.inner  { border-left: 2px solid var(--c-inner); }
  .conflict-card.outer  { border-left: 2px solid var(--c-outer); }
  .conflict-card.shadow-c { border-left: 2px solid var(--c-shadow); }

  .conflict-type {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .conflict-type.inner   { color: var(--c-inner); }
  .conflict-type.outer   { color: var(--c-outer); }
  .conflict-type.shadow-c { color: var(--c-shadow); }

  .conflict-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text2);
  }

  /* ── Resolution ── */
  .resolution-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 0;
  }

  .resolution-steps { list-style: none; }

  .resolution-steps li {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text1);
    padding: 10px 18px 10px 36px;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-weight: 300;
  }

  .resolution-steps li:last-child { border-bottom: none; }

  .resolution-steps li::before {
    content: '→';
    position: absolute;
    left: 16px;
    color: var(--gold);
    opacity: 0.7;
  }

  /* ── Question box ── */
  .question-box {
    margin-top: 6px;
    padding: 16px 18px;
    border-radius: var(--radius);
    border: 1px dashed rgba(201,168,76,0.25);
    background: var(--gold4);
  }

  .question-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 6px;
  }

  .question-box p {
    font-size: 15px;
    font-style: italic;
    font-weight: 300;
    color: var(--text2);
    line-height: 1.7;
  }

  /* ── Footer ── */
  .site-footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 12px;
    color: var(--text3);
    letter-spacing: 0.06em;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Selection ── */
  ::selection { background: rgba(201,168,76,0.2); color: var(--gold2); }
</style>
</head>
<body>
<div class="container">

  <header class="site-header">
    <h1 class="site-title">Tarot & Arquetipos Jungianos</h1>
    <p class="site-subtitle">Los 22 Arcanos Mayores · Mapa de la individuación</p>
  </header>

  <nav class="pkg-nav" id="pkg-nav" aria-label="Seleccionar paquete"></nav>
  <nav class="card-nav hidden" id="card-nav" aria-label="Seleccionar carta"></nav>
  <main id="panels"></main>

  <footer class="site-footer">
    Basado en el sistema Rider-Waite · Psicología profunda de C.G. Jung
  </footer>

</div>

<script>
const PACKAGES = [
  {
    id:"loco", label:"El Loco",
    cards:[{
      num:"0", name:"El Loco", sub:"El Sí-Mismo / El Trickster",
      etapa:"Punto de partida — antes del viaje",
      desc:"Punto de origen antes de toda diferenciación psíquica. Representa la totalidad no diferenciada del psiquismo: el Self que aún no se ha separado en ego y sombra. Es simultáneamente el final y el comienzo del viaje, el estado de potencial puro antes de cualquier forma definida.",
      conflicts:[
        {type:"inner",label:"Conflicto interior",text:"El estado de plenitud indiferenciada no puede durar: la vida exige diferenciación. El conflicto es entre el impulso de permanecer en la libertad total sin forma y la necesidad de encarnarse, elegir y asumir una dirección. La apertura sin límites se convierte en incapacidad de comprometerse."},
        {type:"outer",label:"Conflicto exterior",text:"El Loco choca con un mundo que exige identidad, coherencia y continuidad. El entorno no sabe qué hacer con quien todavía no es nadie o con quien lo ha soltado todo para empezar de nuevo. La incomprensión y el juicio social ante quien da el salto sin garantías."},
        {type:"shadow-c",label:"Conflicto de sombra",text:"La ingenuidad destructiva: el salto al vacío sin conciencia de los riesgos reales. La irresponsabilidad disfrazada de libertad. También el Trickster oscuro que disrumpe por el placer de destruir, sin propósito regenerativo. El eterno comenzador que nunca termina nada."}
      ],
      resolution:["Atreverse al comienzo sin necesidad de garantías, pero con los ojos abiertos: la confianza del Loco no es ceguera.","Distinguir el salto que nace de la libertad interior del que nace de la huida o del miedo al compromiso.","Aceptar la incertidumbre como condición estructural del crecimiento, no como un problema a resolver antes de empezar.","Confiar en que la mochila ya contiene lo necesario para el viaje, aunque aún no se sepa qué hay dentro."],
      question:"¿Qué salto llevo posponiendo porque espero tener más certeza? ¿Estoy comenzando desde la libertad o huyendo de algo?"
    }]
  },
  {
    id:"p1", label:"Paquete I",
    cards:[
      {num:"I",name:"El Mago",sub:"La Persona / El Heraldo",etapa:"Despertar al propio poder",
      desc:"El primer despertar del ego. La conciencia descubre que tiene herramientas y voluntad propias. Es la Persona en formación: la primera máscara competente que el yo construye para relacionarse con el mundo exterior.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"Sabe que tiene capacidades pero duda de ejercerlas. La voluntad existe, pero el miedo al fracaso o al juicio ajeno la paraliza. El ego recién despierto aún no confía en sus propias herramientas."},{type:"outer",label:"Conflicto exterior",text:"Tensión entre lo que se puede hacer y lo que el entorno permite o reconoce. El talento choca con la estructura social: la familia que no valida, el trabajo que no deja espacio."},{type:"shadow-c",label:"Conflicto de sombra",text:"Cuando la voluntad se desvía hacia la manipulación. El Mago en sombra usa sus herramientas para controlar a otros en lugar de crear. El deseo de ser visto puede volverse exhibicionismo o engaño."}],
      resolution:["Identificar con honestidad los recursos reales que ya posees, sin inflarlos ni minimizarlos.","Pasar de la contemplación a la acción: un primer paso concreto que demuestre al ego que la voluntad funciona.","Distinguir el poder personal (crear, manifestar) del poder sobre otros (controlar, manipular). Solo el primero es sostenible.","Construir una 'mesa de trabajo' interior: ¿qué herramientas tengo? ¿cuál usaré hoy?"],
      question:"¿Estoy usando mi capacidad para crear o para controlar? ¿Qué me impide dar el primer paso?"},

      {num:"II",name:"La Sacerdotisa",sub:"El Ánima / La Gran Madre oscura",etapa:"Encuentro con el inconsciente",
      desc:"El encuentro con el inconsciente. Representa el Ánima en su forma más pura: el conocimiento no racional, la intuición profunda, el saber que precede a la comprensión. Es la puerta al mundo interior y a todo lo que el ego racional no puede ver directamente.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La voz interior habla, pero el ego racional la ignora o desconfía de ella. Conflicto entre el conocimiento intuitivo y la necesidad de justificación lógica. La persona sabe sin poder explicar por qué sabe."},{type:"outer",label:"Conflicto exterior",text:"El misterio y la introversión chocan con un mundo que exige resultados visibles y explicaciones racionales. Dificultad para comunicar lo que se percibe. Los demás no entienden la profundidad."},{type:"shadow-c",label:"Conflicto de sombra",text:"El conocimiento se vuelve secreto y excluyente. La inaccesibilidad emocional como defensa. La disociación: el cuerpo vive una realidad mientras la mente habita otra."}],
      resolution:["Crear un espacio regular de silencio sin agenda: meditación, diario, naturaleza.","Practicar confiar en la intuición en decisiones pequeñas antes de aplicarla a las grandes.","Integrar razón e intuición como fuentes complementarias, no rivales.","Sacar el conocimiento interior del secreto: nombrarlo, escribirlo, compartirlo selectivamente."],
      question:"¿Qué sé que no me atrevo a admitir que sé? ¿Estoy escuchando mi voz interior o silenciándola?"},

      {num:"III",name:"La Emperatriz",sub:"La Gran Madre / El Ánima nutricia",etapa:"Enraizamiento en lo material y lo sensorial",
      desc:"La Gran Madre en su polo nutritivo. Encarna la fecundidad, la creatividad encarnada y el amor incondicional. Es el principio de la vida que se sostiene a sí misma: el enraizamiento en lo sensorial, lo corporal y la abundancia material.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"Disconexión del cuerpo y los sentidos en favor de la mente o el espíritu. La persona no puede descansar, recibir placer ni dejar de producir. O en el polo opuesto: el exceso sensorial que evita el crecimiento."},{type:"outer",label:"Conflicto exterior",text:"Tensión entre la necesidad de cuidar y los límites propios. El agotamiento del cuidador. La dificultad de recibir cuando se está habituado a solo dar."},{type:"shadow-c",label:"Conflicto de sombra",text:"La madre devoradora: el cuidado que asfixia, la protección que controla. La sobreprotección como forma de mantener la dependencia ajena."}],
      resolution:["Reaprender a recibir, no solo a dar. La Emperatriz integrada sabe nutrirse antes de nutrir.","Reconectar con el cuerpo como fuente de sabiduría: movimiento, naturaleza, placer consciente.","Distinguir el cuidado que libera del cuidado que encadena.","Cultivar al menos un área creativa donde la abundancia fluya sin producir un resultado útil."],
      question:"¿Estoy nutriendo desde la plenitud o desde el vacío? ¿A quién cuido y a qué coste personal?"},

      {num:"IV",name:"El Emperador",sub:"El Padre / El Senex",etapa:"Consolidación del ego social",
      desc:"El principio de orden y estructura. El Padre arquetípico que da forma al caos y establece las condiciones para el crecimiento. Representa la consolidación del ego social: el momento en que el yo aprende a construir estructuras que sostienen su propio desarrollo y el de los demás.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El ego teme el caos y necesita controlar para sentirse seguro. La rigidez interna: normas propias tan estrictas que no dejan espacio para el error, el juego o el cambio."},{type:"outer",label:"Conflicto exterior",text:"El conflicto con la autoridad externa o su internalización excesiva. La sumisión que mata la iniciativa, o la rebeldía reactiva que tampoco construye nada propio."},{type:"shadow-c",label:"Conflicto de sombra",text:"El tirano: el poder que se ejerce para dominar en lugar de para proteger. La incapacidad de delegar. El Viejo Rey que no sabe pasar el cetro."}],
      resolution:["Aprender a distinguir estructura útil de estructura rígida.","Practicar la autoridad desde el servicio, no desde el miedo al desorden.","Identificar qué estructuras ya no sirven y necesitan transformarse.","Desarrollar la capacidad de dar poder a otros: confiar, delegar, ceder el control."],
      question:"¿Mis estructuras me sirven a mí o yo sirvo a mis estructuras? ¿Estoy ejerciendo autoridad o control?"},

      {num:"V",name:"El Hierofante",sub:"El Anciano Sabio / El Mediador",etapa:"Encuentro con la tradición y el sistema de creencias",
      desc:"El transmisor del conocimiento colectivo. Media entre el individuo y la tradición, entre lo personal y lo institucional. Es el encuentro con el sistema de creencias heredado y la pregunta fundamental de qué tradiciones nutren el crecimiento y cuáles simplemente lo limitan.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La tensión entre la herencia recibida y la propia experiencia que la contradice. El conflicto entre la pertenencia al sistema y la autenticidad personal."},{type:"outer",label:"Conflicto exterior",text:"El individuo frente a la institución. La presión del grupo para conformarse. La dificultad de encontrar mentores reales en un mundo de figuras de autoridad vacías."},{type:"shadow-c",label:"Conflicto de sombra",text:"El dogmatismo que cierra la mente. La obediencia ciega que delega la propia conciencia moral en la institución. O la rebelión sin discernimiento que rechaza todo lo heredado."}],
      resolution:["Inventariar las creencias heredadas: ¿cuáles siguen siendo verdaderas? ¿Cuáles son solo tradición?","Buscar mentores que transmitan sabiduría viva, no solo normas.","Rescatar lo sagrado dentro de la tradición sin aceptar toda la estructura que lo envuelve.","Desarrollar una brújula moral interior propia."],
      question:"¿Qué creo porque lo he vivido y cuánto creo simplemente porque me lo enseñaron?"},

      {num:"VI",name:"Los Enamorados",sub:"El Ánima-Ánimus / La Conjunción",etapa:"Primera gran elección: ego vs. Self",
      desc:"La primera gran disyuntiva del ego: seguir la vía social o escuchar al Self. Representa la coniunctio oppositorum —la unión de Ánima y Ánimus— y el preludio de la individuación. El amor como espejo del propio interior: lo que se busca en el otro revela lo que aún no se ha integrado en uno mismo.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La tensión entre lo que el ego quiere y lo que el Self exige. La primera gran disyuntiva: ¿quién elijo ser?"},{type:"outer",label:"Conflicto exterior",text:"Las relaciones como espejo de la escisión interior. La proyección del Ánima o Ánimus en la pareja. La idealización que colapsa cuando el espejo humano falla."},{type:"shadow-c",label:"Conflicto de sombra",text:"Elegir desde el miedo, la dependencia o la necesidad de aprobación. La proyección romántica que convierte al otro en portador de lo que uno no ha desarrollado."}],
      resolution:["Antes de elegir pareja, elegirse a uno mismo: identificar los valores irrenunciables.","Reconocer las proyecciones: ¿qué cualidades admiro tanto en otros que me pertenecen y no he desarrollado?","Integrar el opuesto interior antes de exigírselo a la pareja.","Aprender a elegir desde la conciencia, no desde la necesidad."],
      question:"¿Estoy amando a esta persona o a mi proyección? ¿Elijo desde mis valores o desde mi miedo?"},

      {num:"VII",name:"El Carro",sub:"El Héroe / El Ego victorioso",etapa:"El ego consolida su identidad y conquista el mundo exterior",
      desc:"El ego en su apogeo. El Héroe ha conquistado el mundo exterior, forjado su identidad y aprende a dominar los opuestos. Es el límite natural del Paquete I: el triunfo que parece una llegada definitiva pero es en realidad el umbral que anuncia que el verdadero viaje interior está a punto de comenzar.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El ego triunfante cree que ha llegado. La identidad construida con tanto esfuerzo se convierte en una armadura tan sólida que impide el crecimiento."},{type:"outer",label:"Conflicto exterior",text:"La tensión entre el logro exterior y el vacío interior. La persona ha conseguido lo que se propuso y descubre que no es suficiente."},{type:"shadow-c",label:"Conflicto de sombra",text:"El control compulsivo. La ambición sin propósito: ganar porque se puede, no porque importe. El triunfo del ego sobre el alma."}],
      resolution:["Reconocer que el triunfo del Carro es real, pero parcial. Hay un territorio interior aún sin conquistar.","Soltar la necesidad de seguir ganando para sentirse válido.","Escuchar el malestar detrás del éxito: ese es el umbral del Paquete II.","Transformar el poder de voluntad en capacidad de rendición inteligente."],
      question:"¿Estoy avanzando hacia algo que me importa de verdad o simplemente siguiendo el impulso de ganar?"}
    ]
  },
  {
    id:"p2", label:"Paquete II",
    cards:[
      {num:"VIII",name:"La Fuerza",sub:"El Ánima domadora / Integración de la Sombra",etapa:"Encuentro con los instintos — inicio real de la individuación",
      desc:"El encuentro con los instintos reprimidos. No se trata de dominar la bestia por la fuerza bruta sino de integrarla con amor consciente. El Ánima actúa como mediadora entre el ego civilizado y la energía animal. Es el inicio real de la individuación: el momento en que el trabajo deja de ser exterior y se vuelve interior.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El ego construido en el Paquete I ha reprimido la energía instintiva para funcionar socialmente. Ahora esa energía —agresividad, sexualidad, deseo de poder— vuelve desde abajo. El conflicto es entre la persona civilizada y la fuerza animal que irrumpe."},{type:"outer",label:"Conflicto exterior",text:"Las situaciones donde ya no alcanza la voluntad: una relación que descontrola, una enfermedad, una atracción irresistible. El entorno obliga a soltar el control."},{type:"shadow-c",label:"Conflicto de sombra",text:"La represión total del instinto —que lo vuelve más peligroso— o la entrega ciega a él. También la violencia disfrazada de virtud."}],
      resolution:["Distinguir represión de integración: no se trata de eliminar el instinto sino de relacionarse con él conscientemente.","Identificar qué impulsos has desterrado de tu imagen de ti mismo.","Buscar formas de expresión legítima para la energía instintiva.","Practicar la fuerza sin armadura: la vulnerabilidad como condición del contacto real."],
      question:"¿Qué impulso en mí trato de ignorar o controlar con más fuerza? ¿Qué me dice eso sobre lo que necesito integrar?"},

      {num:"IX",name:"El Ermitaño",sub:"El Anciano Sabio / El Guía Interior",etapa:"El descenso al interior — la soledad como maestra",
      desc:"El descenso al interior. El Anciano Sabio en su forma más pura: la sabiduría que solo nace del aislamiento voluntario y la reflexión profunda. El Self comienza a hablar desde adentro con voz propia, diferenciada del ruido del mundo exterior.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La voz interior exige un espacio propio real. El ego resiste porque el retiro implica pérdida: de estatus, de relaciones, de la identidad construida en torno a la utilidad social."},{type:"outer",label:"Conflicto exterior",text:"Un entorno que mide el valor por la productividad interpreta la introspección como fracaso. La presión social para seguir 'funcionando' puede impedir el descenso necesario."},{type:"shadow-c",label:"Conflicto de sombra",text:"La soledad que no nutre sino que aísla. El Ermitaño en sombra usa el retiro para evitar la vida. La sabiduría que se vuelve elitista o hermética."}],
      resolution:["Crear condiciones reales de soledad elegida, aunque sean breves.","Aprender a distinguir la soledad fértil de la soledad evitativa.","Desarrollar una práctica de escucha interior regular: el Ermitaño no visita, habita.","Equilibrar el retiro y el retorno: la lámpara está hecha para iluminar el camino de otros."],
      question:"¿Cuándo fue la última vez que estuve en silencio real conmigo mismo? ¿Qué encuentro cuando dejo de estar ocupado?"},

      {num:"X",name:"La Rueda de la Fortuna",sub:"El Trickster / El Destino",etapa:"El yo se encuentra con lo que no controla",
      desc:"El ego se encuentra con lo que no controla. La Rueda representa el movimiento del inconsciente colectivo y la naturaleza cíclica de toda existencia. El Trickster del destino interrumpe los planes del ego para recordarle que el Self no es gobernable por la voluntad.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El ego del Carro ha construido su seguridad sobre la ilusión del control. La Rueda la destruye. La identidad que dependía del control colapsa."},{type:"outer",label:"Conflicto exterior",text:"Los cambios no elegidos: pérdida de trabajo, separación, enfermedad. La vida rearticula el tablero sin consultar al ego."},{type:"shadow-c",label:"Conflicto de sombra",text:"El fatalismo o la victimización crónica. O la hiperactividad de control que intenta detener la Rueda a fuerza de voluntad."}],
      resolution:["Distinguir lo que sí depende de ti de lo que no.","Encontrar el centro inmóvil dentro del movimiento.","Reinterpretar los ciclos: ninguna posición es permanente.","Desarrollar resiliencia basada en la identidad interior, no en las circunstancias."],
      question:"¿Qué estoy intentando controlar que no me pertenece? ¿Qué parte de mí permanece estable cuando todo lo demás gira?"},

      {num:"XI",name:"La Justicia",sub:"El Ánima como Árbitro / El Self regulador",etapa:"El alma aprende a pesarse a sí misma con objetividad",
      desc:"El Self como función reguladora que devuelve el equilibrio cuando el ego se ha desviado. El alma aprende a pesarse a sí misma con objetividad: ni con narcisismo ni con autocrítica destructiva. Es el momento de la responsabilidad honesta y el discernimiento sin condena.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El conflicto entre lo que uno ha hecho y lo que sus propios valores exigen. Verse con claridad es uno de los actos más difíciles del proceso de individuación."},{type:"outer",label:"Conflicto exterior",text:"Las situaciones de injusticia real —recibida o cometida— que exigen una respuesta. También el conflicto con sistemas externos que aplican una justicia ciega o distorsionada."},{type:"shadow-c",label:"Conflicto de sombra",text:"El juicio que se vuelve condena. El perfeccionismo moral que nunca perdona el error. O la evasión de responsabilidad que relativiza todo para no responder de nada."}],
      resolution:["Practicar el examen de conciencia sin autocastigo.","Distinguir responsabilidad —que libera— de culpa —que paraliza.","Aplicar la misma vara con la que mides a los demás a ti mismo, y viceversa.","Ante injusticia real: decidir si se actúa, cómo y a qué coste."],
      question:"¿Estoy siendo justo conmigo mismo? ¿Hay algo de lo que necesito hacerme responsable honestamente?"},

      {num:"XII",name:"El Colgado",sub:"El Sacrificio / La Muerte del ego",etapa:"El ego se rinde — umbral del cambio profundo e irreversible",
      desc:"La rendición voluntaria del ego. Inspirado en el motivo del héroe sacrificado —Odín, Cristo—, representa el momento en que la conciencia se invierte literalmente. El sacrificio que no es derrota sino umbral: solo quien sabe detenerse y soltar puede cruzar hacia la transformación profunda.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El ego ha perdido el control y no puede avanzar haciendo lo que siempre ha hecho. El conflicto es entre la necesidad de actuar —que el ego identifica con existir— y la exigencia de simplemente esperar y soltar."},{type:"outer",label:"Conflicto exterior",text:"Las situaciones en que la acción directa ya no funciona: una enfermedad larga, una espera sin certeza, una pérdida que no se puede resolver. Solo hay postura."},{type:"shadow-c",label:"Conflicto de sombra",text:"El martirio elegido: el sacrificio como forma de control o de llamar la atención. El victimismo que encuentra en el sufrimiento una identidad."}],
      resolution:["Reconocer que hay situaciones en que el movimiento más poderoso es la inmovilidad consciente.","Distinguir rendición activa de pasividad evitativa.","Preguntarse qué visión nueva ofrece la perspectiva invertida del Colgado.","Identificar qué identidad o control concreto está siendo pedido en sacrificio."],
      question:"¿Qué estoy resistiendo soltar porque siento que sin eso no soy yo? ¿Qué nueva perspectiva aparece cuando dejo de luchar?"},

      {num:"XIII",name:"La Muerte",sub:"El Transformador / El Umbral",etapa:"La gran transformación — muerte de la vieja identidad",
      desc:"La gran transformación psíquica. No muerte literal sino disolución de la vieja identidad para que una nueva pueda emerger. El arquetipo del Transformador: el cambio que el psiquismo necesita para seguir creciendo. La carta no muestra el renacimiento, solo el umbral que es necesario cruzar.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El yo que ha sido ya no puede seguir siendo, pero el yo que viene aún no existe. El duelo por la identidad que se pierde es tan real como cualquier duelo. El ego vive este tránsito como una amenaza existencial."},{type:"outer",label:"Conflicto exterior",text:"Las personas del entorno no entienden la transformación. Quien cambia profundamente amenaza los roles establecidos. Las relaciones construidas sobre la antigua identidad pueden no sobrevivir."},{type:"shadow-c",label:"Conflicto de sombra",text:"Aferrarse a lo que ya ha muerto. También la transformación compulsiva que cambia continuamente de forma sin que realmente muera nada."}],
      resolution:["Permitir el duelo real por lo que se pierde: la transformación sin duelo es superficial.","Identificar con precisión qué es lo que muere: no 'yo', sino una versión específica con roles concretos.","Confiar en el proceso sin necesidad de saber ya quién serás después.","No reconstruir prematuramente la vieja estructura para aliviar la ansiedad del vacío."],
      question:"¿Qué rol, creencia o versión de mí mismo ya sé que ha terminado pero sigo sosteniendo por miedo?"},

      {num:"XIV",name:"La Templanza",sub:"El Ánima como Mediadora / El Self integrador",etapa:"Síntesis y equilibrio alquímico tras la gran transformación",
      desc:"El proceso alquímico de la individuación: la mezcla paciente de opuestos. El Ánima actúa como mensajera entre consciente e inconsciente y facilita una síntesis que el ego no puede forzar. La coniunctio se aproxima: los fragmentos del psiquismo comienzan a encontrar su nueva forma.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"Los fragmentos del psiquismo —lo que se perdió, lo que emergió— necesitan una nueva síntesis. El conflicto es la resistencia a mezclar: hay partes de uno mismo que no queremos que se toquen."},{type:"outer",label:"Conflicto exterior",text:"La Templanza exige paciencia en un mundo que valora la velocidad. La presión social para 'ya estar bien' puede interrumpir una integración que necesita su propio tiempo."},{type:"shadow-c",label:"Conflicto de sombra",text:"La moderación que se convierte en mediocridad. También la impaciencia que interrumpe el proceso de síntesis antes de que haya terminado."}],
      resolution:["Aceptar que la integración tras una transformación profunda es lenta y no lineal.","Practicar la coexistencia de opuestos sin necesitar resolver la tensión demasiado pronto.","Confiar en la inteligencia del proceso: la Templanza no mezcla por decisión del ego.","Distinguir equilibrio dinámico de equilibrio estático disfrazado de armonía."],
      question:"¿Qué aspectos de mí mismo me resisto a que convivan? ¿Estoy dando al proceso de integración el tiempo que necesita?"}
    ]
  },
  {
    id:"p3", label:"Paquete III",
    cards:[
      {num:"XV",name:"El Diablo",sub:"La Sombra / El Trickster oscuro",etapa:"Descenso a la Sombra — encuentro con lo más profundamente reprimido",
      desc:"La Sombra en su forma más densa. Todo lo que el ego ha rechazado y proyectado durante el proceso regresa ahora condensado y con toda su fuerza. El Diablo no es externo: es la parte oscura del Self que espera ser integrada para liberar la energía vital que contiene.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"Todo lo que el ego ha rechazado durante los dos paquetes anteriores aparece ahora condensado y con toda su fuerza. El conflicto es entre la imagen que uno tiene de sí mismo y la realidad de lo que también es."},{type:"outer",label:"Conflicto exterior",text:"Las adicciones, las compulsiones, las relaciones de dependencia tóxica. El Diablo siempre parece estar en el otro, en la sustancia, en la situación. Nunca en uno mismo."},{type:"shadow-c",label:"Conflicto de sombra",text:"La proyección máxima: ver el propio mal exclusivamente en otros. O la fascinación oscura que se entrega al instinto sin ninguna conciencia, confundiendo libertad con ausencia de responsabilidad."}],
      resolution:["Asumir que el Diablo no está fuera: lo que más condenas en otros contiene información sobre tu sombra no integrada.","Trabajar las adicciones no como defectos morales sino como energía psíquica mal encauzada.","Distinguir entre reconocer la propia oscuridad —que libera— e identificarse con ella —que esclaviza.","Integrar la vitalidad instintiva que la Sombra contiene: la energía del Diablo integrado es creativa."],
      question:"¿Qué en los demás me genera un rechazo desproporcionado? ¿Qué cadenas llevo que podría quitarme si quisiera?"},

      {num:"XVI",name:"La Torre",sub:"El Destructor / La Ruptura del falso Self",etapa:"Crisis y colapso necesario de la falsa estructura del yo",
      desc:"La crisis que destruye las estructuras falsas. El Self rompe la Persona y las defensas del ego con la precisión de un rayo. Lo que cae no es necesariamente lo real sino lo que se construyó sobre ilusiones o sobre una identidad ya agotada que el psiquismo no puede sostener más.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La Torre derriba exactamente lo que más esfuerzo costó construir. El horror del ego ante la destrucción de su propia obra. Lo que cae no es necesariamente malo — es simplemente falso o ya agotado."},{type:"outer",label:"Conflicto exterior",text:"La crisis llega como acontecimiento externo súbito: un despido, una ruptura, una revelación que lo cambia todo. El rayo no avisa."},{type:"shadow-c",label:"Conflicto de sombra",text:"Reconstruir inmediatamente la misma estructura que acaba de caer. O el nihilismo que, una vez derribada la Torre, concluye que nada vale la pena construir."}],
      resolution:["Resistir el impulso de reconstruir de inmediato: el espacio entre la caída y la reconstrucción es donde ocurre el aprendizaje.","Preguntarse qué sostenía realmente la estructura que cayó: ¿era sólida o una ilusión bien mantenida?","Distinguir lo que el rayo destruyó —la forma falsa— de lo que no puede destruir.","Trabajar el trauma de la crisis sin romantizarlo ni suprimirlo."],
      question:"¿Qué estructura de mi vida siento que podría caer en cualquier momento? ¿Qué seguiría siendo yo si cayera?"},

      {num:"XVII",name:"La Estrella",sub:"El Ánima esperanzadora / El Self como guía",etapa:"Renovación del alma tras la crisis — el Self señala un nuevo horizonte",
      desc:"La renovación del alma tras el colapso. El Ánima como guía espiritual aparece en el momento de mayor vulnerabilidad y señala un nuevo horizonte. La esperanza fundamentada que surge no a pesar de la crisis sino precisamente a través de ella.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"Tras el colapso de la Torre, el ego está en ruinas. La Estrella ofrece una dirección nueva, pero el ego dañado desconfía. El conflicto es entre la esperanza genuina y el cinismo defensivo que aprendió a protegerse no esperando nada."},{type:"outer",label:"Conflicto exterior",text:"El mundo aún lleva las marcas de la crisis. La tensión entre el horizonte que se vislumbra por dentro y la realidad cotidiana que aún no lo refleja."},{type:"shadow-c",label:"Conflicto de sombra",text:"El idealismo que sustituye a la transformación real. La espiritualidad escapista. La esperanza desconectada de la acción, que se convierte en una forma más sofisticada de inmovilidad."}],
      resolution:["Permitirse la esperanza sin exigirle certeza: la Estrella no garantiza el destino, solo señala la dirección.","Reconectar con aquello que da sentido genuino a la propia vida.","Traducir la visión renovada en pasos concretos y pequeños.","Cuidar la fuente interior de renovación sin depender de que el exterior la valide."],
      question:"¿Qué me importa de verdad, más allá de lo que se supone que debería importarme?"},

      {num:"XVIII",name:"La Luna",sub:"La Gran Madre oscura / La Sombra profunda",etapa:"Descenso al inconsciente más profundo — territorio de la sombra ancestral",
      desc:"El inconsciente colectivo en su aspecto más oscuro y confuso. La Gran Madre devoradora y el territorio liminal donde la realidad y la proyección se mezclan. Un territorio que debe cruzarse sin perder el hilo de Ariadna: quien lo atraviesa con conciencia accede a capas de profundidad que ninguna otra carta alcanza.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La Luna activa los miedos más arcaicos: el miedo a la locura, a la disolución del yo, a lo desconocido que habita en las profundidades. El conflicto es entre la necesidad de cruzar ese territorio y el terror a perderse en él sin retorno."},{type:"outer",label:"Conflicto exterior",text:"Las situaciones de confusión prolongada, ilusión o engaño que no se pueden resolver con lógica. La incapacidad de distinguir lo real de lo proyectado."},{type:"shadow-c",label:"Conflicto de sombra",text:"La psicosis o la disociación cuando no hay hilo de Ariadna. O la fascinación por lo oscuro que se convierte en un fin en sí mismo en lugar de un territorio a cruzar."}],
      resolution:["Desarrollar el 'hilo de Ariadna' antes de descender: una práctica de anclaje que sostenga el contacto con lo profundo.","Aprender a habitar la ambigüedad sin necesidad de resolverla prematuramente.","Distinguir intuición profunda de proyección paranoica.","Cuando el territorio sea demasiado oscuro, buscar acompañamiento: la Luna a menudo requiere testigo."],
      question:"¿Qué miedo irracional aparece una y otra vez? ¿Qué hay en mis sueños recurrentes que no me atrevo a mirar?"},

      {num:"XIX",name:"El Sol",sub:"El Niño Divino / El Self radiante",etapa:"Integración lograda — la conciencia integrada irradia naturalmente",
      desc:"El Self en su aspecto más luminoso. El Niño Divino: la psique integrada que irradia naturalmente sin necesidad de defensas. La alegría genuina, la vitalidad sin vergüenza y la conciencia que ya no necesita protegerse de sí misma ni demostrar nada a nadie.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La dificultad de habitar la propia luz sin vergüenza ni inflación. Quien ha vivido en la sombra puede sentir la alegría como algo peligroso, inmerecido o destinado a terminarse pronto."},{type:"outer",label:"Conflicto exterior",text:"La luz visible genera reacciones: la envidia, la proyección positiva, la presión de ser siempre radiante. La incomodidad con la visibilidad o la presión de mantenerla performativamente."},{type:"shadow-c",label:"Conflicto de sombra",text:"La inflación del ego: confundir la luz del Self con la grandeza personal. El narcisismo espiritual. También el exceso de exposición que convierte la autenticidad en espectáculo."}],
      resolution:["Aprender a recibir la propia alegría sin inmediatamente buscar un problema que la interrumpa.","Distinguir la luz del Self —que no necesita ser demostrada— del brillo del ego —que necesita audiencia.","Soltar la creencia de que la felicidad es provisional o inmerecida.","Dejar que la energía solar sea generativa sin necesidad de controlar cómo es recibida."],
      question:"¿Me permito la alegría genuina o la interrumpo antes de que llegue a plena expresión?"},

      {num:"XX",name:"El Juicio",sub:"El Renacimiento / La Llamada del Self",etapa:"La gran llamada — elegir conscientemente responder a la propia vocación",
      desc:"La llamada del Self a completar el proceso. El momento en que el yo elige voluntariamente responder a su vocación más profunda. Implica perdonarse el pasado por completo y asumir la responsabilidad de ser quien realmente se es, sin excusas ni postergaciones.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"El Self llama a completar el proceso y el ego duda. El conflicto es entre la voz que convoca a quien realmente se es y el miedo a la responsabilidad que eso implica. Responder significa dejar de poder decir que no sabías."},{type:"outer",label:"Conflicto exterior",text:"La vocación real contradice las expectativas del entorno. Responder puede implicar decepcionar a personas concretas o abandonar posiciones establecidas."},{type:"shadow-c",label:"Conflicto de sombra",text:"La incapacidad de perdonarse lo que fue. El juicio hacia uno mismo con más dureza que a nadie. La resistencia final disfrazada de humildad: 'yo no soy digno de esa llamada'."}],
      resolution:["Perdonarse el pasado con la misma completud con que se perdonaría a otro.","Escuchar la llamada interior para distinguirla del deseo del ego o del deber social.","Asumir que responder a la vocación es un acto de responsabilidad, no de egoísmo.","Dar un paso concreto en la dirección del llamado, aunque sea pequeño."],
      question:"¿Hay una llamada interior que llevo tiempo ignorando? ¿Qué me impide perdonarme del todo?"},

      {num:"XXI",name:"El Mundo",sub:"El Self integrado / La Individuación completa",etapa:"Culminación — el Self ha completado el ciclo",
      desc:"La individuación completada: la totalidad del psiquismo integrada y consciente de sí misma. No un estado final sino el cierre de un ciclo que abre el siguiente. El Self realizado que celebra su completud y se prepara para convertirse de nuevo en El Loco, con todo lo aprendido y la misma disposición al no saber.",
      conflicts:[{type:"inner",label:"Conflicto interior",text:"La tentación de quedarse en la totalidad alcanzada como si fuera un estado permanente y definitivo. La individuación completada puede convertirse en una nueva cristalización si el ego la convierte en identidad fija."},{type:"outer",label:"Conflicto exterior",text:"El mundo raramente celebra la madurez psicológica profunda. La persona que ha completado un ciclo puede sentir que su entorno no tiene lugar para quien ya es."},{type:"shadow-c",label:"Conflicto de sombra",text:"El estancamiento tras el logro: creer que ya no hay nada más que integrar. Negarse a comenzar el siguiente ciclo porque da vértigo volver a no saber."}],
      resolution:["Celebrar la totalidad alcanzada con plena conciencia: este cierre merece ser reconocido.","Comprender que El Mundo no es el final del mapa sino el final de un ciclo: la individuación es espiral.","Soltar la identidad de 'persona que ha llegado' con la misma disposición con que se soltaron todas las anteriores.","Reconocer el vértigo ante el próximo El Loco como señal de que el siguiente ciclo ya llama."],
      question:"¿Qué ciclo de mi vida está completándose ahora? ¿Puedo celebrarlo y soltarlo al mismo tiempo?"}
    ]
  }
];

function panelId(pi,ci){return`pnl-${pi}-${ci}`}

const pkgNav   = document.getElementById('pkg-nav');
const cardNav  = document.getElementById('card-nav');
const panelsEl = document.getElementById('panels');

// Build all panels
PACKAGES.forEach((pkg,pi)=>{
  pkg.cards.forEach((card,ci)=>{
    const div = document.createElement('article');
    div.className = 'card-panel';
    div.id = panelId(pi,ci);
    div.innerHTML = `
      <div class="card-header">
        <div class="card-num">${card.num}</div>
        <div>
          <h2 class="card-name">${card.name}</h2>
          <p class="card-sub">${card.sub}</p>
        </div>
      </div>
      <p class="card-desc">${card.desc}</p>
      <span class="etapa-tag">${card.etapa}</span>
      <section class="section">
        <p class="section-label">Conflictos que activa</p>
        <div class="conflicts-grid">
          ${card.conflicts.map(cf=>`
            <div class="conflict-card ${cf.type}">
              <p class="conflict-type ${cf.type}">${cf.label}</p>
              <p class="conflict-text">${cf.text}</p>
            </div>`).join('')}
        </div>
      </section>
      <section class="section">
        <p class="section-label">Camino de resolución</p>
        <div class="resolution-box">
          <ul class="resolution-steps">
            ${card.resolution.map(r=>`<li>${r}</li>`).join('')}
          </ul>
        </div>
      </section>
      <div class="question-box">
        <p class="question-label">Pregunta para la reflexión</p>
        <p>${card.question}</p>
      </div>`;
    panelsEl.appendChild(div);
  });
});

// Build package buttons
PACKAGES.forEach((pkg,pi)=>{
  const btn = document.createElement('button');
  btn.className = 'pkg-btn' + (pi===0?' active':'');
  btn.textContent = pkg.label;
  btn.setAttribute('aria-label', `Ver ${pkg.label}`);
  btn.onclick = ()=> selectPkg(pi);
  pkgNav.appendChild(btn);
});

function buildCardNav(pi){
  cardNav.innerHTML='';
  const pkg = PACKAGES[pi];
  if(pkg.cards.length <= 1){ cardNav.classList.add('hidden'); return; }
  cardNav.classList.remove('hidden');
  pkg.cards.forEach((card,ci)=>{
    const btn = document.createElement('button');
    btn.className = 'card-btn'+(ci===0?' active':'');
    btn.textContent = card.num+' · '+card.name;
    btn.onclick = ()=> selectCard(pi,ci);
    cardNav.appendChild(btn);
  });
}

function selectPkg(pi){
  pkgNav.querySelectorAll('.pkg-btn').forEach((b,j)=>b.classList.toggle('active',j===pi));
  buildCardNav(pi);
  showPanel(pi,0);
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectCard(pi,ci){
  cardNav.querySelectorAll('.card-btn').forEach((b,j)=>b.classList.toggle('active',j===ci));
  showPanel(pi,ci);
  // Scroll to top of card content
  const el = document.getElementById(panelId(pi,ci));
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function showPanel(pi,ci){
  document.querySelectorAll('.card-panel').forEach(p=>p.classList.remove('visible'));
  const t = document.getElementById(panelId(pi,ci));
  if(t) t.classList.add('visible');
}

// Init
buildCardNav(0);
showPanel(0,0);
</script>
</body>
</html>
